name: pret-bot

on:
  workflow_dispatch:   # started every hour by cron-job.org (or manually from the Actions tab)

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Bucharest   # so the bot sees Romania time (12:00 report)
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Check price
        run: bundle exec ruby pret_bot.rb

      - name: Save new price
        run: |
          git config user.name "pret-bot"
          git config user.email "pret-bot@users.noreply.github.com"
          git add pret.json istoric.json
          git commit -m "Update price" || echo "No change"
          git pull --rebase   # in case something was pushed while the bot was running
          git push
