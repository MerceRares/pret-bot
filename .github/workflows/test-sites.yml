# TEMPORARY: checks which shops block GitHub's servers (plain request vs real Chrome). Delete after the test.
name: test-sites

on:
  push:
    paths:
      - .github/workflows/test-sites.yml

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Test sites
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36"
          titlu() { grep -oiE '<title[^>]*>[^<]*' "$1" | head -1 | sed 's/<title[^>]*>//' | cut -c1-60; }
          {
            echo "Test run on GitHub server: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            for url in \
              "https://www.sportvision.ro/" \
              "https://www.emag.ro/" \
              "https://www.sportisimo.ro/" \
              "https://mediagalaxy.ro/" \
              "https://altex.ro/home/" \
              "https://www.temu.com/ro-en" \
              "https://ro.shein.com/" \
              "https://www.decathlon.ro/" \
              "https://www.pcgarage.ro/"
            do
              cod=$(curl -s -L -m 25 --compressed -o plain.html -w "%{http_code}" "$url" \
                -H "User-Agent: $UA" \
                -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8" \
                -H "Accept-Language: ro-RO,ro;q=0.9,en;q=0.8" -H "Sec-Fetch-Mode: navigate" \
                -H "Sec-Fetch-Dest: document" -H "Sec-Fetch-Site: none" -H "Upgrade-Insecure-Requests: 1")
              timeout 90 google-chrome --headless=new --no-sandbox --disable-gpu --user-agent="$UA" \
                --virtual-time-budget=15000 --dump-dom "$url" > chrome.html 2>/dev/null
              echo "$url"
              echo "  PLAIN : HTTP $cod | $(wc -c < plain.html) bytes | $(titlu plain.html)"
              echo "  CHROME: $(wc -c < chrome.html) bytes | $(titlu chrome.html)"
            done
          } | tee test-sites-result.txt

      - name: Save result
        run: |
          git config user.name "pret-bot"
          git config user.email "pret-bot@users.noreply.github.com"
          git add test-sites-result.txt
          git commit -m "Test sites result"
          git pull --rebase
          git push
