# TEMPORARY: checks that the NTFY_TOPIC secret works. Delete after the test.
name: test-secret

on:
  push:
    paths:
      - .github/workflows/test-sites.yml

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - name: Send test notification through the secret topic
        run: |
          test -n "$NTFY_TOPIC" || { echo "NTFY_TOPIC secret is empty"; exit 1; }
          curl -s -o /dev/null -w "ntfy HTTP %{http_code}\n" -H "Title: Test secret" -d "Test: topicul vine din secretul GitHub NTFY_TOPIC" "https://ntfy.sh/$NTFY_TOPIC"
