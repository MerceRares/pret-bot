# TEMPORARY: runs the real bot on GitHub's servers with the 11 Zalando products. Delete after the test.
name: test-sites

on:
  push:
    paths:
      - .github/workflows/test-sites.yml

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Bucharest
      BOT_LOCAL: "1"                          # read produse-local.json, which we overwrite below
      NTFY_TOPIC: rares-preturi-zalando-g8m4  # test topic, not the real one
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Run the bot with only the Zalando products
        run: |
          cat > produse-local.json <<'EOF'
          [
            { "nume": "Z1 Jordan", "url": "https://www.zalando.ro/jordan-jumpman-crew-bluza-sport-blackwhite-joc42d09j-q11.html", "selector": "json-ld" },
            { "nume": "Z2 Lakers", "url": "https://www.zalando.ro/nba-nba-los-angeles-lakers-backpack-unisex-rucsac-black-nb342l00i-q11.html", "selector": "json-ld" },
            { "nume": "Z3 Curry", "url": "https://www.zalando.ro/nba-curry-unisex-rucsac-black-nb344e002-q11.html", "selector": "json-ld" },
            { "nume": "Z4 Edwards", "url": "https://www.zalando.ro/nba-edwards-unisex-rucsac-black-nb344e004-q11.html", "selector": "json-ld" },
            { "nume": "Z5 Flagg", "url": "https://www.zalando.ro/nba-flagg-unisex-rucsac-black-nb344e003-q11.html", "selector": "json-ld" },
